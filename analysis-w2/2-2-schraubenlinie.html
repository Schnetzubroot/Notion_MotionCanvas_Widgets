<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurve im Raum: Schraubenlinie t → (cos t, sin t, h t/2π)</title>
<link rel="stylesheet" href="../lib/core.css">
</head>
<body>
<div class="wrap">
  <h1>Kurve im Raum: Schraubenlinie t → (cos t, sin t, h t/2π)</h1>
  <p class="sub">Eine Funktion f : ℝ → ℝ³ beschreibt eine Raumkurve. Hier eine Rechts-Schraubenlinie mit Ganghöhe h auf dem Zylinder mit Radius 1 um die z-Achse.</p>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="legend"><div><span class="sw" style="background:var(--c2)"></span>Schraubenlinie</div><div><span class="sw" style="background:var(--c1)"></span>f(t)</div><div><span class="sw" style="background:var(--field)"></span>Zylinder ρ = 1</div></div>
    <div class="hint">Abspielen, h ändern. Ziehen dreht die Ansicht.</div>
  </div>
  <div class="ctl" id="ctl"></div>
  <div class="info" id="info"></div>
</div>
<script src="../lib/core.js"></script>
<script>
(() => {
  const { V, fmt, fv } = MW;
  const ctl = document.getElementById('ctl'), infoEl = document.getElementById('info'), cv = document.getElementById('cv');

  let h = 1, t = 3;
  const view = MW.View3D(cv, { extent: 2.2, yaw: -35, pitch: 18, center: [0, 0, 1.2] }, v => {
    const C = v.C; v.axes(1.6);
    for (const z of [0, 2.4]) v.poly(v.circlePts([0, 0, z], [0, 0, 1], 1), C.field, 1, [3, 3]);
    for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; v.line([Math.cos(a), Math.sin(a), 0], [Math.cos(a), Math.sin(a), 2.4], C.grid, 1); }
    const pts = []; const tmax = 2.4 / h * 2 * Math.PI; for (let i = 0; i <= 400; i++) { const s = tmax * i / 400; pts.push([Math.cos(s), Math.sin(s), h * s / (2 * Math.PI)]); }
    v.poly(pts, C.c2, 2.2);
    const P = [Math.cos(t), Math.sin(t), h * t / (2 * Math.PI)]; v.line([P[0], P[1], 0], P, C.muted, 1, [3, 3]); v.dot(P, C.c1, 6); v.text(P, 'f(t)', C.c1, 8, -8);
    MW.info(infoEl, 'f(t) = ' + MW.fv(P), [['t', fmt(t)], ['Umläufe t/2π', fmt(t / (2 * Math.PI))], ['Ganghöhe h', fmt(h)]],
      'Nach einem vollen Umlauf (t → t + 2π) ist der Punkt um h höher. Projektion auf die xy-Ebene: der Einheitskreis.');
  });
  MW.player(ctl, { t0: 0, t1: 4 * Math.PI, duration: 8, value: t, onTime: x => { t = x; view.redraw(); } });
  MW.slider(ctl, { label: 'h', min: 0.3, max: 2.4, step: 0.05, value: h, onInput: x => { h = x; view.redraw(); } });

})();
</script>
</body>
</html>
