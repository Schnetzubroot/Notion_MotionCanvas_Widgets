<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stetigkeit: linker Grenzwert = f(ξ) = rechter Grenzwert</title>
<link rel="stylesheet" href="../lib/core.css">
</head>
<body>
<div class="wrap">
  <h1>Stetigkeit: linker Grenzwert = f(ξ) = rechter Grenzwert</h1>
  <p class="sub">f ist stetig in ξ, wenn die Annäherung von links, der Funktionswert und die Annäherung von rechts dasselbe liefern. Wähle ein Beispiel und nähere dich mit δ → 0 von beiden Seiten.</p>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="legend"><div><span class="sw" style="background:var(--c2)"></span>Graph</div><div><span class="sw" style="background:var(--c3)"></span>f(ξ − δ)</div><div><span class="sw" style="background:var(--c4)"></span>f(ξ + δ)</div><div><span class="sw" style="background:var(--c1)"></span>f(ξ)</div></div>
    <div class="hint">Beispiel wählen, δ verkleinern.</div>
  </div>
  <div class="ctl" id="ctl"></div>
  <div class="info" id="info"></div>
</div>
<script src="../lib/core.js"></script>
<script>
(() => {
  const { V, fmt, fv } = MW;
  const ctl = document.getElementById('ctl'), infoEl = document.getElementById('info'), cv = document.getElementById('cv');

  const mkAx = (x0, x1, y0, y1, W = 6, H = 3.4, ox = 0, oy = 0) => {
    const X = x => ox + (x - x0) / (x1 - x0) * W, Y = y => oy + (y - y0) / (y1 - y0) * H;
    return { x0, x1, y0, y1, W, H, ox, oy, X, Y, P: (x, y) => [X(x), Y(y)], inY: y => y >= y0 && y <= y1 };
  };
  const nice = r => { const raw = r / 6, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; };
  function axes(v, A, xl, yl, xs, ys) {
    const C = v.C; xs = xs || nice(A.x1 - A.x0); ys = ys || nice(A.y1 - A.y0);
    for (let x = Math.ceil(A.x0 / xs - 1e-9) * xs; x <= A.x1 + 1e-9; x += xs) { v.line(A.P(x, A.y0), A.P(x, A.y1), C.grid, 1); v.text(A.P(x, A.y0), fmt(x, 3), C.muted, 0, 15, 11, false, 'center'); }
    for (let y = Math.ceil(A.y0 / ys - 1e-9) * ys; y <= A.y1 + 1e-9; y += ys) { v.line(A.P(A.x0, y), A.P(A.x1, y), C.grid, 1); v.text(A.P(A.x0, y), fmt(y, 3), C.muted, -5, 4, 11, false, 'right'); }
    if (A.y0 <= 0 && A.y1 >= 0) v.line(A.P(A.x0, 0), A.P(A.x1, 0), C.muted, 1.3);
    if (A.x0 <= 0 && A.x1 >= 0) v.line(A.P(0, A.y0), A.P(0, A.y1), C.muted, 1.3);
    if (xl) v.text(A.P(A.x1, A.y0), xl, C.muted, -2, -6, 12, false, 'right');
    if (yl) v.text(A.P(A.x0, A.y1), yl, C.muted, 6, 14, 12, false);
  }
  // Graph einer Funktion, unterbrochen bei Sprüngen und ausserhalb des Fensters
  function fplot(v, A, f, color, w = 2, N = 600, a = A.x0, b = A.x1) {
    const H = A.y1 - A.y0, inside = y => y >= A.y0 && y <= A.y1, cl = y => Math.max(A.y0, Math.min(A.y1, y));
    let seg = [], px = null, py = null;
    const flush = () => { if (seg.length > 1) v.poly(seg, color, w); seg = []; };
    for (let i = 0; i <= N; i++) { const x = a + (b - a) * i / N, y = f(x);
      if (!isFinite(y)) { flush(); px = null; continue; }
      if (px !== null && Math.abs(y - py) > 2 * H && !(inside(y) && inside(py))) { flush(); px = x; py = y; if (inside(y)) seg.push(A.P(x, y)); continue; }
      if (px !== null && inside(y) !== inside(py)) { // Rand schneiden
        const yb = inside(py) ? (y > A.y1 ? A.y1 : A.y0) : (py > A.y1 ? A.y1 : A.y0), xb = px + (x - px) * (yb - py) / (y - py);
        if (inside(py)) { seg.push(A.P(xb, yb)); flush(); } else { flush(); seg.push(A.P(xb, yb)); }
      } else if (px !== null && !inside(y) && !inside(py) && (y - A.y1) * (py - A.y1) < 0 && (y - A.y0) * (py - A.y0) < 0) { flush(); }
      if (inside(y)) seg.push(A.P(x, y));
      px = x; py = y; }
    flush();
  }

  const g = x => x === 0 ? 1 : Math.pow(2, -1 / x);
  const S = {
    g0: { name: 'g(x) = 2^(−1/x), g(0) = 1, bei ξ = 0', f: g, xi: 0, win: [-2, 2, -0.3, 4], L: '+∞ (existiert nicht)', R: '0', val: 1, ok: false, note: 'Drei verschiedene „Werte“: links unbeschränkt, rechts 0, g(0) = 1. Keine Beziehung, nicht stetig.' },
    g1: { name: 'dieselbe Funktion g bei ξ = 1', f: g, xi: 1, win: [-0.5, 2.5, -0.3, 1.5], L: '1/2', R: '1/2', val: 0.5, ok: true, note: 'Links, rechts und Funktionswert stimmen überein: g ist stetig in ξ = 1.' },
    sgn: { name: 'Sprungfunktion bei ξ = 0', f: x => x < 0 ? -1 : x > 0 ? 1 : 0, xi: 0, win: [-2, 2, -1.5, 1.5], L: '−1', R: '1', val: 0, ok: false, note: 'Beide einseitigen Grenzwerte existieren, sind aber verschieden: Sprungstelle.' },
    sinc: { name: 'sin x / x, bei 0 durch 1 ergänzt', f: x => x === 0 ? 1 : Math.sin(x) / x, xi: 0, win: [-6, 6, -0.4, 1.3], L: '1', R: '1', val: 1, ok: true, note: 'Ohne Ergänzung ist ξ = 0 nicht im Definitionsbereich. Mit f(0) := 1 wird die Funktion stetig, weil beide Grenzwerte 1 sind.' },
    rat: { name: 'x/(x − 2) bei ξ = 2', f: x => x / (x - 2), xi: 2, win: [-1, 5, -6, 8], L: '−∞', R: '+∞', val: NaN, ok: null, note: 'x = 2 gehört nicht zu D(f). Die Funktion ist trotzdem „stetig“: stetig in allen Punkten ihres Definitionsbereiches.' },
    sq: { name: 'x² bei ξ = π', f: x => x * x, xi: Math.PI, win: [0, 5, -1, 16], L: 'π²', R: 'π²', val: Math.PI ** 2, ok: true, note: 'So rechnet man mit π: x² auf 3, 3.1, 3.14, … auswerten. Das ist erlaubt, weil x² stetig ist.' },
  };
  let key = 'g0', ld = Math.log10(0.5);
  const view = MW.View2D(cv, { xmin: -0.75, xmax: 6.25, ymin: -0.45, ymax: 3.55 }, v => {
    const C = v.C, s = S[key], d = Math.pow(10, ld), [x0, x1, y0, y1] = s.win, A = mkAx(x0, x1, y0, y1); axes(v, A, 'x', 'y');
    fplot(v, A, s.f, C.c2, 2.3, 1600, x0, s.xi - 1e-6); fplot(v, A, s.f, C.c2, 2.3, 1600, s.xi + 1e-6, x1);
    v.line(A.P(s.xi, y0), A.P(s.xi, y1), C.muted, 1, [4, 4]);
    const yl = s.f(s.xi - d), yr = s.f(s.xi + d);
    if (A.inY(yl)) v.dot(A.P(s.xi - d, yl), C.c3, 6); else v.text(A.P(s.xi - d, yl > y1 ? y1 : y0), yl > y1 ? '↑' : '↓', C.c3, -4, yl > y1 ? 14 : -4, 16);
    if (A.inY(yr)) v.dot(A.P(s.xi + d, yr), C.c4, 6); else v.text(A.P(s.xi + d, yr > y1 ? y1 : y0), yr > y1 ? '↑' : '↓', C.c4, -4, yr > y1 ? 14 : -4, 16);
    if (isFinite(s.val)) v.dot(A.P(s.xi, s.val), C.c1, 6);
    const head = s.ok === true ? 'stetig in ξ' : s.ok === false ? 'nicht stetig in ξ' : 'ξ ∉ D(f): Frage nach Stetigkeit stellt sich nicht';
    const show = y => !isFinite(y) ? '–' : Math.abs(y) > 1e6 ? y.toExponential(2) : fmt(y, 5);
    MW.info(infoEl, head, [['f(ξ − δ)', show(yl)], ['f(ξ)', isFinite(s.val) ? fmt(s.val, 5) : 'nicht definiert'], ['f(ξ + δ)', show(yr)], ['lim links / rechts', s.L + '  /  ' + s.R]], s.note, s.ok === false);
  });
  MW.select(ctl, 'Beispiel', Object.entries(S).map(([k, s]) => [k, s.name]), x => { key = x; view.redraw(); });
  MW.slider(ctl, { label: 'δ', min: -4, max: 0, step: 0.01, value: ld, fmt: x => fmt(Math.pow(10, x), 4), onInput: x => { ld = x; view.redraw(); } });

})();
</script>
</body>
</html>
