<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerade, ungerade, monoton</title>
<link rel="stylesheet" href="../lib/core.css">
</head>
<body>
<div class="wrap">
  <h1>Gerade, ungerade, monoton</h1>
  <p class="sub">Gerade: f(−x) = f(x), Graph spiegelsymmetrisch zur y-Achse. Ungerade: f(−x) = −f(x), Graph punktsymmetrisch zum Ursprung. Beides verlangt einen zum Nullpunkt symmetrischen Definitionsbereich.</p>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="legend"><div><span class="sw" style="background:var(--c2)"></span>Graph</div><div><span class="sw" style="background:var(--c1)"></span>(x, f(x))</div><div><span class="sw" style="background:var(--c3)"></span>(−x, f(−x))</div></div>
    <div class="hint">Funktion wählen, x verschieben.</div>
  </div>
  <div class="ctl" id="ctl"></div>
  <div class="info" id="info"></div>
</div>
<script src="../lib/core.js"></script>
<script>
(() => {
  const { V, fmt, fv } = MW;
  const ctl = document.getElementById('ctl'), infoEl = document.getElementById('info'), cv = document.getElementById('cv');

  const mkAx = (x0, x1, y0, y1, W = 6, H = 3.4, ox = 0, oy = 0) => {
    const X = x => ox + (x - x0) / (x1 - x0) * W, Y = y => oy + (y - y0) / (y1 - y0) * H;
    return { x0, x1, y0, y1, W, H, ox, oy, X, Y, P: (x, y) => [X(x), Y(y)], inY: y => y >= y0 && y <= y1 };
  };
  const nice = r => { const raw = r / 6, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; };
  function axes(v, A, xl, yl, xs, ys) {
    const C = v.C; xs = xs || nice(A.x1 - A.x0); ys = ys || nice(A.y1 - A.y0);
    for (let x = Math.ceil(A.x0 / xs - 1e-9) * xs; x <= A.x1 + 1e-9; x += xs) { v.line(A.P(x, A.y0), A.P(x, A.y1), C.grid, 1); v.text(A.P(x, A.y0), fmt(x, 3), C.muted, 0, 15, 11, false, 'center'); }
    for (let y = Math.ceil(A.y0 / ys - 1e-9) * ys; y <= A.y1 + 1e-9; y += ys) { v.line(A.P(A.x0, y), A.P(A.x1, y), C.grid, 1); v.text(A.P(A.x0, y), fmt(y, 3), C.muted, -5, 4, 11, false, 'right'); }
    if (A.y0 <= 0 && A.y1 >= 0) v.line(A.P(A.x0, 0), A.P(A.x1, 0), C.muted, 1.3);
    if (A.x0 <= 0 && A.x1 >= 0) v.line(A.P(0, A.y0), A.P(0, A.y1), C.muted, 1.3);
    if (xl) v.text(A.P(A.x1, A.y0), xl, C.muted, -2, -6, 12, false, 'right');
    if (yl) v.text(A.P(A.x0, A.y1), yl, C.muted, 6, 14, 12, false);
  }
  // Graph einer Funktion, unterbrochen bei Sprüngen und ausserhalb des Fensters
  function fplot(v, A, f, color, w = 2, N = 600, a = A.x0, b = A.x1) {
    const H = A.y1 - A.y0, inside = y => y >= A.y0 && y <= A.y1, cl = y => Math.max(A.y0, Math.min(A.y1, y));
    let seg = [], px = null, py = null;
    const flush = () => { if (seg.length > 1) v.poly(seg, color, w); seg = []; };
    for (let i = 0; i <= N; i++) { const x = a + (b - a) * i / N, y = f(x);
      if (!isFinite(y)) { flush(); px = null; continue; }
      if (px !== null && Math.abs(y - py) > 2 * H && !(inside(y) && inside(py))) { flush(); px = x; py = y; if (inside(y)) seg.push(A.P(x, y)); continue; }
      if (px !== null && inside(y) !== inside(py)) { // Rand schneiden
        const yb = inside(py) ? (y > A.y1 ? A.y1 : A.y0) : (py > A.y1 ? A.y1 : A.y0), xb = px + (x - px) * (yb - py) / (y - py);
        if (inside(py)) { seg.push(A.P(xb, yb)); flush(); } else { flush(); seg.push(A.P(xb, yb)); }
      } else if (px !== null && !inside(y) && !inside(py) && (y - A.y1) * (py - A.y1) < 0 && (y - A.y0) * (py - A.y0) < 0) { flush(); }
      if (inside(y)) seg.push(A.P(x, y));
      px = x; py = y; }
    flush();
  }

  const cbrt = Math.cbrt;
  const S = {
    p2: ['x²', x => x * x, 'gerade', 'fallend auf (−∞, 0], wachsend auf [0, ∞)'],
    p3: ['x³', x => x ** 3, 'ungerade', 'strikt wachsend auf ℝ'],
    m1: ['x⁻¹ = 1/x', x => 1 / x, 'ungerade', 'strikt fallend auf (−∞, 0) und auf (0, ∞), aber nicht auf ganz D(f)'],
    m2: ['x⁻² = 1/x²', x => 1 / (x * x), 'gerade', 'wachsend auf (−∞, 0), fallend auf (0, ∞)'],
    h: ['x^(1/2) = √x', x => x >= 0 ? Math.sqrt(x) : NaN, 'weder (D(f) = [0, ∞) ist nicht symmetrisch)', 'strikt wachsend'],
    t: ['x^(2/3) = ∛(x²)', x => cbrt(x * x), 'gerade', 'fallend auf (−∞, 0], wachsend auf [0, ∞)'],
    sin: ['sin x', Math.sin, 'ungerade', 'periodisch (2π), wachsend auf [−π/2, π/2]'],
    cos: ['cos x', Math.cos, 'gerade', 'periodisch (2π), fallend auf [0, π]'],
    tan: ['tan x', Math.tan, 'ungerade', 'periodisch (π), strikt wachsend auf (−π/2, π/2)'],
    exp: ['eˣ', Math.exp, 'weder', 'strikt wachsend auf ℝ'],
    ln: ['ln x', x => x > 0 ? Math.log(x) : NaN, 'weder (D(f) = (0, ∞))', 'strikt wachsend'],
    mix: ['x² + x', x => x * x + x, 'weder', 'fallend auf (−∞, −1/2], wachsend auf [−1/2, ∞)'],
  };
  let key = 'p3', x0 = 1.2;
  const view = MW.View2D(cv, { xmin: -0.75, xmax: 6.25, ymin: -0.45, ymax: 3.55 }, v => {
    const C = v.C, [name, f, sym, mon] = S[key], A = mkAx(-4, 4, -3, 3); axes(v, A, 'x', 'y', 1, 1);
    fplot(v, A, f, C.c2, 2.5, 1600);
    const y1 = f(x0), y2 = f(-x0);
    if (isFinite(y1) && A.inY(y1)) { v.line(A.P(x0, 0), A.P(x0, y1), C.c1, 1, [3, 3]); v.dot(A.P(x0, y1), C.c1, 6); }
    if (isFinite(y2) && A.inY(y2)) { v.line(A.P(-x0, 0), A.P(-x0, y2), C.c3, 1, [3, 3]); v.dot(A.P(-x0, y2), C.c3, 6); }
    if (sym.startsWith('ungerade') && isFinite(y1) && A.inY(y1) && A.inY(-y1)) v.line(A.P(x0, y1), A.P(-x0, -y1), C.muted, 1, [2, 4]);
    if (sym.startsWith('gerade') && isFinite(y1) && A.inY(y1)) v.line(A.P(x0, y1), A.P(-x0, y1), C.muted, 1, [2, 4]);
    MW.info(infoEl, 'f(x) = ' + name + ': ' + sym, [['f(' + fmt(x0) + ')', fmt(y1, 4)], ['f(' + fmt(-x0) + ')', fmt(y2, 4)], ['Monotonie', mon]],
      'Test: f(−x) mit f(x) vergleichen. Gleich → gerade, entgegengesetzt → ungerade. Ein Gegenbeispiel genügt für „weder“.');
  });
  MW.select(ctl, 'Funktion', Object.entries(S).map(([k, s]) => [k, s[0]]), x => { key = x; view.redraw(); }).set(key);
  MW.slider(ctl, { label: 'x', min: 0.05, max: 3.9, step: 0.01, value: x0, onInput: x => { x0 = x; view.redraw(); } });

})();
</script>
</body>
</html>
