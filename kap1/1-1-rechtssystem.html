<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rechtssystem Oxyz</title>
<link rel="stylesheet" href="../lib/core.css">
</head>
<body>
<div class="wrap">
  <h1>Rechtssystem Oxyz</h1>
  <p class="sub">Die positiven Achsen Ox, Oy, Oz bilden ein Rechtssystem: e<sub>x</sub> × e<sub>y</sub> = e<sub>z</sub> (rechte Hand: Daumen x, Zeigefinger y, Mittelfinger z).</p>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="legend"><div><span class="sw" style="background:var(--c1)"></span>e_x</div><div><span class="sw" style="background:var(--c3)"></span>e_y</div><div><span class="sw" style="background:var(--c2)"></span>e_z</div><div><span class="sw" style="background:var(--c5)"></span>e_x × e_y</div></div>
    <div class="hint">Ziehen zum Drehen.</div>
  </div>
  <div class="ctl" id="ctl"></div>
  <div class="info" id="info"></div>
</div>
<script src="../lib/core.js"></script>
<script>
(() => {
  const { V, fmt, fv } = MW;
  const ctl = document.getElementById('ctl'), infoEl = document.getElementById('info'), cv = document.getElementById('cv');

  let flip = false;
  const view = MW.View3D(cv, { extent: 1.8, yaw: 35, pitch: 20 }, v => {
    const C = v.C, ex = [1, 0, 0], ey = flip ? [0, -1, 0] : [0, 1, 0], ez = [0, 0, 1];
    v.arrow([0, 0, 0], ex, C.c1, 3); v.text(ex, 'x', C.c1, 4, 4);
    v.arrow([0, 0, 0], ey, C.c3, 3); v.text(ey, 'y', C.c3, 4, 4);
    v.arrow([0, 0, 0], ez, C.c2, 3); v.text(ez, 'z', C.c2, 4, 4);
    const c = V.cross(ex, ey);
    v.arrow([0, 0, 0], V.mul(c, 1.3), C.c5, 1.8); v.text(V.mul(c, 1.3), 'e_x × e_y', C.c5, 6, 0, 12);
    const ok = V.dot(c, ez) > 0;
    MW.info(infoEl, ok ? 'Rechtssystem' : 'Linkssystem (nicht erlaubt)', [['e_x × e_y', fv(c, 0)], ['e_z', fv(ez, 0)]],
      ok ? 'e_x × e_y zeigt in Richtung e_z.' : 'Mit umgedrehter y-Achse zeigt e_x × e_y entgegen e_z. Alle Formeln mit Kreuzprodukten bekämen falsche Vorzeichen.', !ok);
  });
  MW.check(ctl, 'y-Achse umdrehen', false, f => { flip = f; view.redraw(); });
  MW.button(ctl, 'Ansicht zurücksetzen', () => view.resetView());

})();
</script>
</body>
</html>
