<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v = ṙ: Geschwindigkeit ist die Ableitung des Ortsvektors</title>
<link rel="stylesheet" href="../lib/core.css">
</head>
<body>
<div class="wrap">
  <h1>v = ṙ: Geschwindigkeit ist die Ableitung des Ortsvektors</h1>
  <p class="sub">Die Spitze des Ortsvektors r(t) zeichnet die Bahnkurve. Seine zeitliche Ableitung ṙ ist die Geschwindigkeit v, tangential zur Bahn.</p>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="legend"><div><span class="sw" style="background:var(--fg)"></span>r(t)</div><div><span class="sw" style="background:var(--c1)"></span>v = ṙ</div><div><span class="sw" style="background:var(--c3)"></span>Bahnkurve</div></div>
    <div class="hint">Abspielen.</div>
  </div>
  <div class="ctl" id="ctl"></div>
  <div class="info" id="info"></div>
</div>
<script src="../lib/core.js"></script>
<script>
(() => {
  const { V, fmt, fv } = MW;
  const ctl = document.getElementById('ctl'), infoEl = document.getElementById('info'), cv = document.getElementById('cv');

  const r = t => [2.2 * Math.cos(t) - 0.3, 1.3 * Math.sin(t) + 0.4 * Math.sin(2 * t)];
  const rd = t => [-2.2 * Math.sin(t), 1.3 * Math.cos(t) + 0.8 * Math.cos(2 * t)];
  let t = 1;
  const view = MW.View2D(cv, { xmin: -3, xmax: 2.6, ymin: -1.9, ymax: 1.9 }, v => {
    const C = v.C; v.grid(1, true, false);
    const pts = []; for (let i = 0; i <= 120; i++) pts.push(r(t * i / 120)); v.poly(pts, C.c3, 2.5);
    const M = r(t); v.arrow([0, 0], M, C.fg, 2); v.text(V.mul(M, 0.5), 'r', C.fg, 6, -4);
    v.arrow(M, V.mul(rd(t), 0.5), C.c1, 3); v.text(V.add(M, V.mul(rd(t), 0.5)), 'v', C.c1, 4, -4);
    v.dot(M, C.fg, 6); v.dot([0, 0], C.fg, 4); v.text([0, 0], 'O', C.fg, -14, 16);
    MW.info(infoEl, 'v = ṙ = ' + fv(rd(t)), [['r', fv(M)], ['Schnelligkeit |v|', fmt(V.norm(rd(t)))]],
      'Formel (2.5): v = ṙ. Zusammen mit v = ṡ τ (2.3) sind das zwei gleichwertige Definitionen der Geschwindigkeit. (v ist mit 0,5 skaliert.)');
  });
  MW.player(ctl, { t0: 0, t1: 2 * Math.PI, duration: 8, value: 1, onTime: x => { t = x; view.redraw(); } });

})();
</script>
</body>
</html>
