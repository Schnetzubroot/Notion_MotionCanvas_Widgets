<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die Ableitung als Funktion: Steigung an jeder Stelle</title>
<link rel="stylesheet" href="../lib/core.css">
</head>
<body>
<div class="wrap">
  <h1>Die Ableitung als Funktion: Steigung an jeder Stelle</h1>
  <p class="sub">Oben f mit der Tangente an der Stelle x, unten die Ableitung f′. Der Punkt unten hat als Höhe genau die Steigung der Tangente oben.</p>
  <div class="stage">
    <canvas id="cv" class="tall"></canvas>
    <div class="legend"><div><span class="sw" style="background:var(--c2)"></span>f</div><div><span class="sw" style="background:var(--c3)"></span>Tangente</div><div><span class="sw" style="background:var(--c1)"></span>f′</div></div>
    <div class="hint">Funktion wählen, x verschieben oder abspielen.</div>
  </div>
  <div class="ctl" id="ctl"></div>
  <div class="info" id="info"></div>
</div>
<script src="../lib/core.js"></script>
<script>
(() => {
  const { V, fmt, fv } = MW;
  const ctl = document.getElementById('ctl'), infoEl = document.getElementById('info'), cv = document.getElementById('cv');

  const mkAx = (x0, x1, y0, y1, W = 6, H = 3.4, ox = 0, oy = 0) => {
    const X = x => ox + (x - x0) / (x1 - x0) * W, Y = y => oy + (y - y0) / (y1 - y0) * H;
    return { x0, x1, y0, y1, W, H, ox, oy, X, Y, P: (x, y) => [X(x), Y(y)], inY: y => y >= y0 && y <= y1 };
  };
  const nice = r => { const raw = r / 6, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; };
  function axes(v, A, xl, yl, xs, ys) {
    const C = v.C; xs = xs || nice(A.x1 - A.x0); ys = ys || nice(A.y1 - A.y0);
    for (let x = Math.ceil(A.x0 / xs - 1e-9) * xs; x <= A.x1 + 1e-9; x += xs) { v.line(A.P(x, A.y0), A.P(x, A.y1), C.grid, 1); v.text(A.P(x, A.y0), fmt(x, 3), C.muted, 0, 15, 11, false, 'center'); }
    for (let y = Math.ceil(A.y0 / ys - 1e-9) * ys; y <= A.y1 + 1e-9; y += ys) { v.line(A.P(A.x0, y), A.P(A.x1, y), C.grid, 1); v.text(A.P(A.x0, y), fmt(y, 3), C.muted, -5, 4, 11, false, 'right'); }
    if (A.y0 <= 0 && A.y1 >= 0) v.line(A.P(A.x0, 0), A.P(A.x1, 0), C.muted, 1.3);
    if (A.x0 <= 0 && A.x1 >= 0) v.line(A.P(0, A.y0), A.P(0, A.y1), C.muted, 1.3);
    if (xl) v.text(A.P(A.x1, A.y0), xl, C.muted, -2, -6, 12, false, 'right');
    if (yl) v.text(A.P(A.x0, A.y1), yl, C.muted, 6, 14, 12, false);
  }
  // Graph einer Funktion, unterbrochen bei Sprüngen und ausserhalb des Fensters
  function fplot(v, A, f, color, w = 2, N = 600, a = A.x0, b = A.x1) {
    const H = A.y1 - A.y0, inside = y => y >= A.y0 && y <= A.y1, cl = y => Math.max(A.y0, Math.min(A.y1, y));
    let seg = [], px = null, py = null;
    const flush = () => { if (seg.length > 1) v.poly(seg, color, w); seg = []; };
    for (let i = 0; i <= N; i++) { const x = a + (b - a) * i / N, y = f(x);
      if (!isFinite(y)) { flush(); px = null; continue; }
      if (px !== null && Math.abs(y - py) > 2 * H && !(inside(y) && inside(py))) { flush(); px = x; py = y; if (inside(y)) seg.push(A.P(x, y)); continue; }
      if (px !== null && inside(y) !== inside(py)) { // Rand schneiden
        const yb = inside(py) ? (y > A.y1 ? A.y1 : A.y0) : (py > A.y1 ? A.y1 : A.y0), xb = px + (x - px) * (yb - py) / (y - py);
        if (inside(py)) { seg.push(A.P(xb, yb)); flush(); } else { flush(); seg.push(A.P(xb, yb)); }
      } else if (px !== null && !inside(y) && !inside(py) && (y - A.y1) * (py - A.y1) < 0 && (y - A.y0) * (py - A.y0) < 0) { flush(); }
      if (inside(y)) seg.push(A.P(x, y));
      px = x; py = y; }
    flush();
  }

  const nd = (f, x, h = 1e-5) => (f(x + h) - f(x - h)) / (2 * h);

  const S = {
    x3: { name: 'f(x) = x³, f′(x) = 3x²', f: x => x ** 3, df: x => 3 * x * x, w: [-2, 2], y: [-4, 4], dy: [-1, 12], note: 'Produktregel mit x³ = x · x²: f′ = 1 · x² + x · 2x = 3x² (Vorlesung, S. 3).' },
    sin: { name: 'f(x) = sin x, f′(x) = cos x', f: Math.sin, df: Math.cos, w: [-6.3, 6.3], y: [-1.4, 1.4], dy: [-1.4, 1.4], note: 'Wo sin ein Maximum hat, ist cos = 0. Wo sin am steilsten steigt, ist cos = 1.' },
    tan: { name: 'f(x) = tan x, f′(x) = 1/cos²x = 1 + tan²x', f: Math.tan, df: x => 1 / Math.cos(x) ** 2, w: [-1.5, 1.5], y: [-6, 6], dy: [0, 8], note: 'Quotientenregel mit sin/cos: (cos²x + sin²x)/cos²x = 1/cos²x (Vorlesung, S. 3).' },
    inv: { name: 'f(x) = 1/x, f′(x) = −1/x²', f: x => 1 / x, df: x => -1 / (x * x), w: [-3, 3], y: [-4, 4], dy: [-6, 0.5], note: 'Quotientenregel mit f = 1, g = x: (0 · x − 1 · 1)/x² = −1/x². Überall negativ: auf jedem Ast fallend.' },
    abs: { name: 'f(x) = |x|, f′(x) = ±1', f: Math.abs, df: x => x > 0 ? 1 : x < 0 ? -1 : NaN, w: [-2, 2], y: [-0.5, 2], dy: [-1.5, 1.5], note: 'Für x ≠ 0 ist f′ = ±1. Bei 0 ist f nicht differenzierbar, f′ hat dort eine Lücke.' },
  };
  let key = 'x3', x = 1;
  const view = MW.View2D(cv, { xmin: -0.75, xmax: 6.25, ymin: -0.45, ymax: 3.75 }, v => {
    const C = v.C, s = S[key], A = mkAx(s.w[0], s.w[1], s.y[0], s.y[1], 6, 2.2, 0, 1.55), B = mkAx(s.w[0], s.w[1], s.dy[0], s.dy[1], 6, 1.25, 0, 0);
    axes(v, A, 'x', 'f'); axes(v, B, 'x', 'f′');
    fplot(v, A, s.f, C.c2, 2.5, 1200); fplot(v, B, s.df, C.line, 1.5, 1200); fplot(v, B, s.df, C.c1, 2.5, 600, s.w[0], x);
    const y = s.f(x), m = s.df(x);
    if (isFinite(m)) fplot(v, A, t => y + m * (t - x), C.c3, 1.6, 20);
    if (A.inY(y)) v.dot(A.P(x, y), C.fg, 6);
    if (isFinite(m) && B.inY(m)) { v.dot(B.P(x, m), C.c1, 6); v.line(B.P(x, m), A.P(x, Math.max(s.y[0], Math.min(s.y[1], y))), C.muted, 1, [2, 4]); }
    MW.info(infoEl, s.name, [['x', fmt(x, 3)], ['f(x)', fmt(y, 4)], ['Steigung f′(x)', isFinite(m) ? fmt(m, 4) : 'nicht definiert'], ['Kontrolle: Differenzenquotient', isFinite(m) ? fmt(nd(s.f, x), 4) : '–']], s.note);
  });
  const sl = MW.player(ctl, { label: 'x', t0: -2, t1: 2, duration: 8, value: x, onTime: t => { x = Math.abs(t) < 1e-9 ? 1e-9 : t; view.redraw(); } });
  MW.select(ctl, 'Funktion', Object.entries(S).map(([k, s]) => [k, s.name]), t => { key = t; const s = S[key];
    const inp = ctl.querySelector('input[type=range]'); inp.min = s.w[0]; inp.max = s.w[1]; inp.step = (s.w[1] - s.w[0]) / 400;
    x = Math.max(s.w[0], Math.min(s.w[1], x)); inp.value = x; view.redraw(); }).set(key);

})();
</script>
</body>
</html>
