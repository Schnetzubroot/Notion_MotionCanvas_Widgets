<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphen schrittweise aus bekannten Graphen aufbauen</title>
<link rel="stylesheet" href="../lib/core.css">
</head>
<body>
<div class="wrap">
  <h1>Graphen schrittweise aus bekannten Graphen aufbauen</h1>
  <p class="sub">Eine kompliziertere Funktion als Kette der sechs Grundtransformationen lesen und den Graphen Schritt für Schritt entstehen lassen. Hellgrau: vorheriger Schritt.</p>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="legend"><div><span class="sw" style="background:var(--line)"></span>vorheriger Schritt</div><div><span class="sw" style="background:var(--c2)"></span>aktueller Schritt</div></div>
    <div class="hint">Beispiel wählen, Schritt erhöhen.</div>
  </div>
  <div class="ctl" id="ctl"></div>
  <div class="info" id="info"></div>
</div>
<script src="../lib/core.js"></script>
<script>
(() => {
  const { V, fmt, fv } = MW;
  const ctl = document.getElementById('ctl'), infoEl = document.getElementById('info'), cv = document.getElementById('cv');

  const mkAx = (x0, x1, y0, y1, W = 6, H = 3.4, ox = 0, oy = 0) => {
    const X = x => ox + (x - x0) / (x1 - x0) * W, Y = y => oy + (y - y0) / (y1 - y0) * H;
    return { x0, x1, y0, y1, W, H, ox, oy, X, Y, P: (x, y) => [X(x), Y(y)], inY: y => y >= y0 && y <= y1 };
  };
  const nice = r => { const raw = r / 6, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; };
  function axes(v, A, xl, yl, xs, ys) {
    const C = v.C; xs = xs || nice(A.x1 - A.x0); ys = ys || nice(A.y1 - A.y0);
    for (let x = Math.ceil(A.x0 / xs - 1e-9) * xs; x <= A.x1 + 1e-9; x += xs) { v.line(A.P(x, A.y0), A.P(x, A.y1), C.grid, 1); v.text(A.P(x, A.y0), fmt(x, 3), C.muted, 0, 15, 11, false, 'center'); }
    for (let y = Math.ceil(A.y0 / ys - 1e-9) * ys; y <= A.y1 + 1e-9; y += ys) { v.line(A.P(A.x0, y), A.P(A.x1, y), C.grid, 1); v.text(A.P(A.x0, y), fmt(y, 3), C.muted, -5, 4, 11, false, 'right'); }
    if (A.y0 <= 0 && A.y1 >= 0) v.line(A.P(A.x0, 0), A.P(A.x1, 0), C.muted, 1.3);
    if (A.x0 <= 0 && A.x1 >= 0) v.line(A.P(0, A.y0), A.P(0, A.y1), C.muted, 1.3);
    if (xl) v.text(A.P(A.x1, A.y0), xl, C.muted, -2, -6, 12, false, 'right');
    if (yl) v.text(A.P(A.x0, A.y1), yl, C.muted, 6, 14, 12, false);
  }
  // Graph einer Funktion, unterbrochen bei Sprüngen und ausserhalb des Fensters
  function fplot(v, A, f, color, w = 2, N = 600, a = A.x0, b = A.x1) {
    const H = A.y1 - A.y0, inside = y => y >= A.y0 && y <= A.y1, cl = y => Math.max(A.y0, Math.min(A.y1, y));
    let seg = [], px = null, py = null;
    const flush = () => { if (seg.length > 1) v.poly(seg, color, w); seg = []; };
    for (let i = 0; i <= N; i++) { const x = a + (b - a) * i / N, y = f(x);
      if (!isFinite(y)) { flush(); px = null; continue; }
      if (px !== null && Math.abs(y - py) > 2 * H && !(inside(y) && inside(py))) { flush(); px = x; py = y; if (inside(y)) seg.push(A.P(x, y)); continue; }
      if (px !== null && inside(y) !== inside(py)) { // Rand schneiden
        const yb = inside(py) ? (y > A.y1 ? A.y1 : A.y0) : (py > A.y1 ? A.y1 : A.y0), xb = px + (x - px) * (yb - py) / (y - py);
        if (inside(py)) { seg.push(A.P(xb, yb)); flush(); } else { flush(); seg.push(A.P(xb, yb)); }
      } else if (px !== null && !inside(y) && !inside(py) && (y - A.y1) * (py - A.y1) < 0 && (y - A.y0) * (py - A.y0) < 0) { flush(); }
      if (inside(y)) seg.push(A.P(x, y));
      px = x; py = y; }
    flush();
  }

  const E = {
    rat: { name: 'f(x) = 3/((x + 5)(x − 2))  (Skript)', win: [-8, 5, -3, 3], steps: [
      ['p(x) = (x + 5)(x − 2)', x => (x + 5) * (x - 2), 'Parabel, nach oben offen, Nullstellen −5 und 2, Scheitel bei x = −3/2.'],
      ['1/p(x)', x => 1 / ((x + 5) * (x - 2)), 'Transformation (5): Nullstellen von p werden Pole, der Scheitel wird zum Hochpunkt.'],
      ['3/p(x)', x => 3 / ((x + 5) * (x - 2)), 'Transformation (4) mit d = 3: Streckung in y-Richtung. Lage der Extremalstelle (x = −3/2) bleibt.']] },
    cos: { name: 'g(x) = 2 cos(3x + 1/2)  (Skript)', win: [-1, 4, -2.6, 2.6], steps: [
      ['cos x', Math.cos, 'Ausgangsgraph.'],
      ['cos(3x)', x => Math.cos(3 * x), 'Transformation (3) mit c = 3: Stauchung in x-Richtung, Periode 2π/3.'],
      ['cos(3x + 1/2) = cos(3(x + 1/6))', x => Math.cos(3 * x + 0.5), 'Transformation (1): Verschiebung um 1/6 nach links.'],
      ['2 cos(3x + 1/2)', x => 2 * Math.cos(3 * x + 0.5), 'Transformation (4) mit d = 2: Amplitude 2.']] },
    tan: { name: 'f(x) = (1/3) tan(2x − π/2) + 2  (Vorlesung)', win: [-3.2, 3.2, -3, 5], steps: [
      ['tan x', Math.tan, 'Ausgangsgraph, Pole bei ±π/2.'],
      ['tan(2x)', x => Math.tan(2 * x), 'Transformation (3) mit c = 2: Periode π/2.'],
      ['tan(2x − π/2) = tan(2(x − π/4))', x => Math.tan(2 * x - Math.PI / 2), 'Transformation (1): Verschiebung um π/4 nach rechts.'],
      ['(1/3) tan(2x − π/2)', x => Math.tan(2 * x - Math.PI / 2) / 3, 'Transformation (4) mit d = 1/3: Stauchung in y-Richtung.'],
      ['(1/3) tan(2x − π/2) + 2', x => Math.tan(2 * x - Math.PI / 2) / 3 + 2, 'Transformation (2) mit b = 2: Verschiebung nach oben.']] },
  };
  let key = 'rat', k = 0;
  const view = MW.View2D(cv, { xmin: -0.75, xmax: 6.25, ymin: -0.45, ymax: 3.55 }, v => {
    const C = v.C, e = E[key], [x0, x1, y0, y1] = e.win, A = mkAx(x0, x1, y0, y1); axes(v, A, 'x', 'y');
    if (k > 0) fplot(v, A, e.steps[k - 1][1], C.line, 2, 2000);
    fplot(v, A, e.steps[k][1], C.c2, 2.6, 2000);
    MW.info(infoEl, 'Schritt ' + (k + 1) + ' von ' + e.steps.length + ': ' + e.steps[k][0], [], e.steps[k][2]);
  });
  const sl = MW.slider(ctl, { label: 'Schritt', min: 0, max: 2, step: 1, value: 0, fmt: x => String(x + 1), onInput: x => { k = x; view.redraw(); } });
  MW.select(ctl, 'Beispiel', Object.entries(E).map(([k, s]) => [k, s.name]), x => { key = x; k = 0;
    const inp = ctl.querySelector('input[type=range]'); inp.max = E[key].steps.length - 1; sl.set(0); view.redraw(); }).set(key);

})();
</script>
</body>
</html>
