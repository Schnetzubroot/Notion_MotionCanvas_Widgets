<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harmonische und gedämpfte Schwingung</title>
<link rel="stylesheet" href="../lib/core.css">
</head>
<body>
<div class="wrap">
  <h1>Harmonische und gedämpfte Schwingung</h1>
  <p class="sub">s̈ + ω²s = 0 hat die Lösungen s(t) = B cos ωt + C sin ωt = A cos(ωt + φ). Mit Dämpfung a > 0 wird daraus e^(−at)·A cos(ωt + φ): die Kurve pendelt zwischen den Hüllkurven ±A e^(−at).</p>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="legend"><div><span class="sw" style="background:var(--c2)"></span>s(t)</div><div><span class="sw" style="background:var(--c4)"></span>Hüllkurven ±A e^(−at)</div><div><span class="sw" style="background:var(--c1)"></span>Nullstellen</div></div>
    <div class="hint">B, C, ω und die Dämpfung a verändern.</div>
  </div>
  <div class="ctl" id="ctl"></div>
  <div class="info" id="info"></div>
</div>
<script src="../lib/core.js"></script>
<script>
(() => {
  const { V, fmt, fv } = MW;
  const ctl = document.getElementById('ctl'), infoEl = document.getElementById('info'), cv = document.getElementById('cv');

  const mkAx = (x0, x1, y0, y1, W = 6, H = 3.4, ox = 0, oy = 0) => {
    const X = x => ox + (x - x0) / (x1 - x0) * W, Y = y => oy + (y - y0) / (y1 - y0) * H;
    return { x0, x1, y0, y1, W, H, ox, oy, X, Y, P: (x, y) => [X(x), Y(y)], inY: y => y >= y0 && y <= y1 };
  };
  const nice = r => { const raw = r / 6, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; };
  function axes(v, A, xl, yl, xs, ys) {
    const C = v.C; xs = xs || nice(A.x1 - A.x0); ys = ys || nice(A.y1 - A.y0);
    for (let x = Math.ceil(A.x0 / xs - 1e-9) * xs; x <= A.x1 + 1e-9; x += xs) { v.line(A.P(x, A.y0), A.P(x, A.y1), C.grid, 1); v.text(A.P(x, A.y0), fmt(x, 3), C.muted, 0, 15, 11, false, 'center'); }
    for (let y = Math.ceil(A.y0 / ys - 1e-9) * ys; y <= A.y1 + 1e-9; y += ys) { v.line(A.P(A.x0, y), A.P(A.x1, y), C.grid, 1); v.text(A.P(A.x0, y), fmt(y, 3), C.muted, -5, 4, 11, false, 'right'); }
    if (A.y0 <= 0 && A.y1 >= 0) v.line(A.P(A.x0, 0), A.P(A.x1, 0), C.muted, 1.3);
    if (A.x0 <= 0 && A.x1 >= 0) v.line(A.P(0, A.y0), A.P(0, A.y1), C.muted, 1.3);
    if (xl) v.text(A.P(A.x1, A.y0), xl, C.muted, -2, -6, 12, false, 'right');
    if (yl) v.text(A.P(A.x0, A.y1), yl, C.muted, 6, 14, 12, false);
  }
  // Graph einer Funktion, unterbrochen bei Sprüngen und ausserhalb des Fensters
  function fplot(v, A, f, color, w = 2, N = 600, a = A.x0, b = A.x1) {
    const H = A.y1 - A.y0, inside = y => y >= A.y0 && y <= A.y1, cl = y => Math.max(A.y0, Math.min(A.y1, y));
    let seg = [], px = null, py = null;
    const flush = () => { if (seg.length > 1) v.poly(seg, color, w); seg = []; };
    for (let i = 0; i <= N; i++) { const x = a + (b - a) * i / N, y = f(x);
      if (!isFinite(y)) { flush(); px = null; continue; }
      if (px !== null && Math.abs(y - py) > 2 * H && !(inside(y) && inside(py))) { flush(); px = x; py = y; if (inside(y)) seg.push(A.P(x, y)); continue; }
      if (px !== null && inside(y) !== inside(py)) { // Rand schneiden
        const yb = inside(py) ? (y > A.y1 ? A.y1 : A.y0) : (py > A.y1 ? A.y1 : A.y0), xb = px + (x - px) * (yb - py) / (y - py);
        if (inside(py)) { seg.push(A.P(xb, yb)); flush(); } else { flush(); seg.push(A.P(xb, yb)); }
      } else if (px !== null && !inside(y) && !inside(py) && (y - A.y1) * (py - A.y1) < 0 && (y - A.y0) * (py - A.y0) < 0) { flush(); }
      if (inside(y)) seg.push(A.P(x, y));
      px = x; py = y; }
    flush();
  }

  function dplot(v, A, f, color, w = 1.3, N = 300, a = A.x0, b = A.x1) { let seg = [];
    const fl = () => { if (seg.length > 1) v.poly(seg, color, w, [5, 4]); seg = []; };
    for (let i = 0; i <= N; i++) { const x = a + (b - a) * i / N, y = f(x); if (!isFinite(y) || !A.inY(y)) { fl(); continue; } seg.push(A.P(x, y)); } fl(); }
  const KX = 'rgba(15, 157, 88, 0.11)', KV = 'rgba(209, 69, 59, 0.10)';
  // gleiche Skalierung in x und y (Zeichenfläche 6 × 3.4)
  const eqAx = (xc, yc, hw) => mkAx(xc - hw, xc + hw, yc - hw * 3.4 / 6, yc + hw * 3.4 / 6);
  const range = (f, a, b, N = 400) => { let lo = Infinity, hi = -Infinity; for (let i = 0; i <= N; i++) { const y = f(a + (b - a) * i / N); if (isFinite(y)) { lo = Math.min(lo, y); hi = Math.max(hi, y); } } const p = 0.08 * (hi - lo || 1); return [lo - p, hi + p]; };
  const roots = (g, a, b, N = 2000) => { const r = []; let px = a, pg = g(a);
    for (let i = 1; i <= N; i++) { const x = a + (b - a) * i / N, y = g(x); if (isFinite(y) && isFinite(pg) && pg * y < 0) { let l = px, h = x; for (let k = 0; k < 60; k++) { const m = (l + h) / 2; (g(l) * g(m) <= 0) ? h = m : l = m; } r.push((l + h) / 2); } px = x; pg = y; } return r; };
  const cplot = (v, A, r, t0, t1, color, w = 2.2, N = 600) => { let seg = []; const fl = () => { if (seg.length > 1) v.poly(seg, color, w); seg = []; };
    for (let i = 0; i <= N; i++) { const p = r(t0 + (t1 - t0) * i / N); if (!isFinite(p[0]) || !isFinite(p[1]) || !A.inY(p[1]) || p[0] < A.x0 || p[0] > A.x1) { fl(); continue; } seg.push(A.P(p[0], p[1])); } fl(); };

  let B = 1, Cc = 1, w = 2, a = 0;
  const view = MW.View2D(cv, { xmin: -0.75, xmax: 6.25, ymin: -0.45, ymax: 3.55 }, v => {
    const C = v.C, A0 = Math.hypot(B, Cc), phi = Math.atan2(-Cc, B), T = 4 * Math.PI;
    const Ay = Math.max(A0, 0.5) * 1.15, A = mkAx(0, T, -Ay, Ay); axes(v, A, 't', 's', Math.PI / 2);
    const s = t => Math.exp(-a * t) * (B * Math.cos(w * t) + Cc * Math.sin(w * t));
    if (A0 > 0) { fplot(v, A, t => A0 * Math.exp(-a * t), C.c4, 1.4); fplot(v, A, t => -A0 * Math.exp(-a * t), C.c4, 1.4); }
    fplot(v, A, s, C.c2, 2.6, 900);
    const z = roots(s, 0, T, 3000); z.forEach(t => v.dot(A.P(t, 0), C.c1, 4));
    MW.info(infoEl, 's(t) = ' + (a ? 'e^(−' + fmt(a, 2) + 't) · ' : '') + '(' + fmt(B, 2) + ' cos ' + fmt(w, 2) + 't + ' + fmt(Cc, 2) + ' sin ' + fmt(w, 2) + 't)',
      [['Amplitude A = √(B² + C²)', fmt(A0, 4)], ['Phase φ (B = A cos φ, C = −A sin φ)', fmt(phi, 4) + ' = ' + fmt(phi * 180 / Math.PI, 1) + '°'], ['Periode 2π/ω', fmt(2 * Math.PI / w, 4)], ['Nullstellen im Bild', String(z.length)]],
      'Notizen Kap. II S. 35 und Skript S. 61–63: B cos ωt + C sin ωt = A cos(ωt + φ). Beim Ausmultiplizieren von A cos(ωt + φ) = A cos φ cos ωt − A sin φ sin ωt folgt B = A cos φ und C = −A sin φ (die Notizen enthalten dazu einen Korrekturhinweis). Dämpfung: Skript S. 63–64 mit Beispiel e^(−t) sin t. Die Nullstellen hängen nicht von a ab.');
  });
  MW.slider(ctl, { label: 'B', min: -2, max: 2, step: 0.05, value: B, onInput: u => { B = u; view.redraw(); } });
  MW.slider(ctl, { label: 'C', min: -2, max: 2, step: 0.05, value: Cc, onInput: u => { Cc = u; view.redraw(); } });
  MW.slider(ctl, { label: 'ω', min: 0.5, max: 4, step: 0.05, value: w, onInput: u => { w = u; view.redraw(); } });
  MW.slider(ctl, { label: 'Dämpfung a', min: 0, max: 0.8, step: 0.01, value: a, onInput: u => { a = u; view.redraw(); } });

})();
</script>
</body>
</html>
